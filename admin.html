<main id="main" tabindex="-1">

<section class="page-hero" style="min-height:40svh"><div class="wrap">
<span class="eyebrow"><i class="fa-solid fa-lock"></i> Owner area</span>
<h1 data-split>Club control</h1></div></section>
<section style="padding-top:10px"><div class="wrap">
<div id="login" class="card admin-box"><h3>Owner login</h3><p>Enter your admin passcode to manage the schedule and announcements.</p>
<form id="loginForm" style="margin-top:20px"><label>Passcode<input type="password" name="pass" required autocomplete="current-password"></label>
<div class="note" id="loginNote"></div><button class="btn" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Log in</button></form></div>

<div id="panel" hidden>
<div class="admin-top"><div class="tabs" id="tabs" style="margin:0">
<button class="chip on" data-tab="schedule"><i class="fa-regular fa-calendar"></i> Schedule</button>
<button class="chip" data-tab="announcements"><i class="fa-solid fa-bullhorn"></i> Announcements</button>
<button class="chip" data-tab="reservations"><i class="fa-solid fa-ticket"></i> Reservations</button>
<button class="chip" data-tab="messages"><i class="fa-solid fa-inbox"></i> Messages</button></div>
<div style="display:flex;gap:10px"><button class="btn sm" id="newBtn"><i class="fa-solid fa-plus"></i> New</button><button class="btn sm ghost" id="logout"><i class="fa-solid fa-right-from-bracket"></i> Log out</button></div></div>
<div class="card scroll-x" style="margin-top:20px;padding:12px"><table class="table"><thead id="thead"></thead><tbody id="tbody"></tbody></table><div id="adminEmpty" class="empty" hidden style="border:0">Nothing here yet.</div></div>
</div></div></section>

<div class="modal" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editTitle"><div class="box">
<button class="x" aria-label="Close"><i class="fa-solid fa-xmark"></i></button><h3 id="editTitle">Edit</h3>
